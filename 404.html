<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>Game Area</title>
<!--
  GitHub Pages has no server-side routing: it can only serve real files.
  A "pretty" per-game URL like /Game-Area/game/some-slug has no matching
  file on disk, so GitHub serves this 404 page for it instead of erroring.

  This script redirects back to index.html, passing the originally
  requested path in a query string (?p=...) so index.html's own routing
  code (see handleInitialRoute() in index.html) can read it and open the
  right game — this also makes shared game links and Google's crawler
  work correctly. This is the standard "SPA on GitHub Pages" redirect
  trick.
-->
<script>
  var basePath = '/Game-Area/';
  var requestedPath = location.pathname + location.search + location.hash;
  location.replace(basePath + '?p=' + encodeURIComponent(requestedPath));
</script>
</head>
<body>
  <p>...جاري التحويل</p>
</body>
</html>
